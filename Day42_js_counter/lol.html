<!DOCTYPE html>
<html>

<head>
    <style>
        .box {
            width: 300px;
            height: 200px;
            background: #444;
            border-radius: 15px;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .child {
            width: 120px;
            height: 80px;
            background: #888;
            border-radius: 10px;
        }

        .log {
            margin-top: 20px;
            font-family: monospace;
            white-space: pre;
            background: black;
            color: #0f0;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <h2>mouseenter vs mouseover demo</h2>

    <div class="box" id="parent">
        Parent
        <div class="child" id="child"></div>
    </div>

    <div class="log" id="log"></div>

    <script>
        const log = msg => {
            document.querySelector("#log").textContent += msg + "\n";
        };

        const parent = document.querySelector("#parent");
        const child = document.querySelector("#child");

        parent.addEventListener("mouseenter", () => {
            log("PARENT: mouseenter (fires once)");
        });

        parent.addEventListener("mouseover", () => {
            log("PARENT: mouseover (fires again on child!)");
        });
    </script>

</body>

</html>
