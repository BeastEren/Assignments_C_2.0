<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano Modern C4-C6</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="piano">
        <div class="key" data-note="A">A</div>
        <div class="key" data-note="B">B</div>
        <div class="key black" data-note="C" style="left: 90px;">C</div>

        <div class="key" data-note="D">D</div>
        <div class="key black" data-note="E" style="left: 160px;">E</div>

        <div class="key" data-note="F">F</div>
        <div class="key" data-note="G">G</div>
        <div class="key black" data-note="H" style="left: 300px;">H</div>

        <div class="key" data-note="I">I</div>
        <div class="key black" data-note="J" style="left: 370px;">J</div>

        <div class="key" data-note="K">K</div>
        <div class="key black" data-note="L" style="left: 440px;">L</div>

        <div class="key" data-note="M">M</div>
        <div class="key" data-note="N">N</div>
        <div class="key black" data-note="O" style="left: 580px;">O</div>

        <div class="key" data-note="P">P</div>
        <div class="key black" data-note="Q" style="left: 650px;">Q</div>

        <div class="key" data-note="R">R</div>
        <div class="key" data-note="S">S</div>
        <div class="key black" data-note="T" style="left: 790px;">T</div>

        <div class="key" data-note="U">U</div>
        <div class="key black" data-note="V" style="left: 860px;">V</div>

        <div class="key" data-note="W">W</div>
        <div class="key black" data-note="X" style="left: 930px;">X</div>
        <div class="key" data-note="Y">Y</div>
        <div class="key" data-note="Z">Z</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
